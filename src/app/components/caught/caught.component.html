<h1>Pokémons I've caught</h1>

<div
  *ngIf="caughtPokemons.length > 0; else noPokemons"
  class="caught-pokemon-container"
>
  <mat-card *ngFor="let pokemon of caughtPokemons" class="caught-card">
    <mat-card-header>
      <mat-card-title>{{ pokemon.name | titlecase }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <img [src]="pokemon.sprites.front_default" alt="{{ pokemon.name }}" />
      <button
        mat-raised-button
        color="warn"
        (click)="removePokemon(pokemon.id)"
      >
        Remove from Caught
      </button>
    </mat-card-content>
  </mat-card>
</div>

<ng-template #noPokemons>
  <div class="no-pokemon-message">No Pokémon caught yet!</div>
</ng-template>
